version: '3.8'

services:
  # 1. Base de Datos (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: orderflow-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_pass_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow_user} -d ${POSTGRES_DB:-orderflow_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Broker de Mensajería (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderflow-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
