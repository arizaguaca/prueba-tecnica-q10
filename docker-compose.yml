version: '3.8'

services:
  # 1. Base de Datos (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: orderflow-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_pass_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow_user} -d ${POSTGRES_DB:-orderflow_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Broker de Mensajería (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderflow-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Orders API (.NET 8 Web API)
  orders-api:
    build:
      context: .
      dockerfile: src/orders-api/Dockerfile
    container_name: orderflow-orders-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-orderflow_db};Username=${POSTGRES_USER:-orderflow_user};Password=${POSTGRES_PASSWORD:-orderflow_pass_secret};Port=5432
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5051:5051"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 4. Inventory Worker (.NET 8 Worker Service)
  inventory-worker:
    build:
      context: .
      dockerfile: src/inventory-worker/Dockerfile
    container_name: orderflow-inventory-worker
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-orderflow_db};Username=${POSTGRES_USER:-orderflow_user};Password=${POSTGRES_PASSWORD:-orderflow_pass_secret};Port=5432
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - DOTNET_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 5. Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5051
    container_name: orderflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - orders-api

volumes:
  postgres_data:
